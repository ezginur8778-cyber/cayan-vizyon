
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>Dizi Detayı | Çayan Vizyon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#111;border-bottom:2px solid #e50914}
.logo{color:#e50914;font-size:24px;font-weight:bold;text-decoration:none}
main{max-width:1000px;margin:auto;padding:25px}
.hero{display:grid;grid-template-columns:280px 1fr;gap:25px}
.poster{width:100%;border-radius:10px;max-height:430px;object-fit:cover}
h1{font-size:32px}
p{color:#ccc;line-height:1.7}
.info{background:#191919;padding:18px;border-radius:10px;margin-top:25px}
a.button{display:inline-block;background:#e50914;color:white;text-decoration:none;padding:12px 18px;border-radius:6px;margin-top:10px}
.back{color:#ff747b;text-decoration:none}
@media(max-width:600px){
.hero{grid-template-columns:1fr}
.poster{max-width:240px}
h1{font-size:25px}
}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">ÇAYAN VİZYON</a>
</header>
<main>
<a class="back" href="index.html">← Ana sayfaya dön</a>
<section class="hero">
<img class="poster" id="poster" alt="Dizi afişi">
<div>
<h1 id="title">Dizi yükleniyor...</h1>
<p id="summary">Dizi bilgileri hazırlanıyor.</p>
<p id="genre"></p>
<p id="date"></p>
<p id="status"></p>
<a class="button" id="trailer" target="_blank" rel="noopener">Fragmanı bul</a>
</div>
</section>
<section class="info">
<h2>Oyuncu Kadrosu</h2>
<p id="cast">Oyuncular yükleniyor...</p>
</section>
<section class="info">
<h2>Sezon ve Bölüm Bilgileri</h2>
<p id="episodes">Bilgiler yükleniyor...</p>
</section>
</main>
<script>
const params=new URLSearchParams(location.search);
const name=params.get('dizi')||'Stranger Things';
document.title=name+' | Çayan Vizyon';
document.getElementById('title').textContent=name;
document.getElementById('trailer').href=
'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' official trailer');

async function loadShow(){
try{
const response=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(name)+'&embed[]=cast&embed[]=episodes');
if(!response.ok)throw new Error('Dizi bulunamadı');
const show=await response.json();
document.getElementById('title').textContent=show.name;
document.getElementById('summary').textContent=(show.summary||'Dizi özeti henüz eklenmedi.').replace(/<[^>]*>/g,'');
document.getElementById('genre').textContent='Tür: '+(show.genres||[]).join(', ');
document.getElementById('date').textContent='Başlangıç: '+(show.premiered||'Bilinmiyor');
document.getElementById('status').textContent='Durum: '+(show.status||'Bilinmiyor');
if(show.image){
document.getElementById('poster').src=show.image.original||show.image.medium;
}else{
document.getElementById('poster').alt='Afiş bulunamadı';
}
const cast=show._embedded?.cast||[];
document.getElementById('cast').textContent=cast.length?cast.slice(0,15).map(x=>x.person.name+' ('+x.character.name+')').join(', '):'Oyuncu bilgisi bulunamadı.';
const episodes=show._embedded?.episodes||[];
document.getElementById('episodes').textContent=episodes.length?'Toplam '+episodes.length+' bölüm bilgisi bulundu.': 'Bölüm bilgisi bulunamadı.';
}catch(error){
document.getElementById('summary').textContent='Bu dizi için otomatik bilgi bulunamadı.';
document.getElementById('cast').textContent='Oyuncu bilgisi alınamadı.';
document.getElementById('episodes').textContent='Bölüm bilgisi alınamadı.';
}
}
loadShow();
</script>
</body>
</html>
